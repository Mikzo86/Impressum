<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Datenschutz — MIKZO</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020408;
            --card-bg: rgba(10, 14, 23, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --text-main: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .box {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            backdrop-filter: blur(25px);
        }
        h1 { font-size: 1.5rem; margin-bottom: 15px; color: var(--accent); }
        p { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 25px; }
        a {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: var(--accent);
            border-radius: 10px;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Datenschutz</h1>
        <p>// Wird gerade aktualisiert – bin gleich wieder da!</p>
        <a href="/">← Zurück zur Startseite</a>
    </div>
</body>
</html>
