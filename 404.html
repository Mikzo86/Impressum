<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wartungsarbeiten — MIKZO</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020408;
            --card-bg: rgba(10, 14, 23, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .box {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(20px);
        }
        h1 { font-size: 2rem; margin-bottom: 15px; color: var(--accent); }
        p { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Wartungsarbeiten</h1>
        <p>MIKZO ist gleich wieder da.<br>Wir aktualisieren gerade das System.</p>
    </div>
</body>
</html>
