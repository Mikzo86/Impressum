<!DOCTYPE html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Verhindert die Indexierung durch Suchmaschinen -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Social Media Vorschau-Tags -->
    <meta property="og:title" content="MIKZO — Offizielle Kanäle">
    <meta property="og:description" content="Alle offiziellen Social-Media-Kanäle von MIKZO auf einen Blick.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://mikzo.de/preview.jpg">
    <meta property="og:url" content="https://mikzo.de/">
    <meta property="og:image:type" content="image/jpeg">

    <!-- Dynamisches Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23020408%22/><text x=%2250%%22 y=%2254%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22800%22 font-size=%2265%22 fill=%22%2338bdf8%22>M</text></svg>">

    <title>MIKZO — Offizielle Kanäle</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #020408;
            --card-bg: rgba(10, 14, 23, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-active: rgba(56, 189, 248, 0.5);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --live-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(56, 189, 248, 0.08) 0%,
                    transparent 40%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(14, 165, 233, 0.05) 0%,
                    transparent 40%
                );

            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 60px 40px;
            overflow-x: hidden;
        }

        /* HIGH-END ADDON: Cinematic Film Grain Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* =========================
            MOUSE GLOW
        ========================= */

        body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            left: 0;
            top: 0;
            pointer-events: none;
            z-index: -1;

            background: radial-gradient(
                circle,
                rgba(56, 189, 248, 0.07) 0%,
                rgba(56, 189, 248, 0.035) 25%,
                transparent 70%
            );

            transform: translate3d(
                calc(var(--mouse-x, 50vw) - 250px),
                calc(var(--mouse-y, 50vh) - 250px),
                0
            );

            transition: transform 0.35s ease-out;
        }

        .agency-wrapper {
            width: min(940px, 100%);
            margin: 0 auto;

            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 50px;
            align-items: center;

            animation: fadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .agency-brand {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .agency-brand h1 {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 0.95;

            background: linear-gradient(
                120deg,
                #ffffff 30%,
                var(--accent) 50%,
                #ffffff 70%
            );

            background-size: 200% auto;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: shimmer 6s linear infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .agency-brand p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* =========================
            UPLOAD SCHEDULE
        ========================= */

        .upload-schedule {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;

            margin-top: 8px;
            padding-top: 16px;

            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;

            opacity: 0;
            transform: translateY(8px);

            animation:
                scheduleReveal
                0.8s
                cubic-bezier(0.16, 1, 0.3, 1)
                1s
                forwards;
        }

        .upload-schedule::before {
            content: '';
            position: absolute;

            top: 0;
            left: 0;

            width: 42px;
            height: 1px;

            background: linear-gradient(
                90deg,
                var(--accent),
                transparent
            );

            opacity: 0.7;
        }

        .upload-status-dot {
            width: 6px;
            height: 6px;

            flex: 0 0 6px;

            border-radius: 50%;
            background: var(--accent);

            box-shadow:
                0 0 6px rgba(56, 189, 248, 0.8),
                0 0 14px rgba(56, 189, 248, 0.35);

            animation: uploadPulse 2.4s ease-in-out infinite;
        }

        .upload-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .upload-label {
            color: var(--text-muted);
            font-size: 0.58rem;
            letter-spacing: 2.5px;
        }

        .upload-time {
            color: var(--text-main);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .upload-platform {
            color: var(--accent);
            font-size: 0.55rem;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        @keyframes scheduleReveal {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes uploadPulse {
            0%,
            100% {
                transform: scale(0.85);
                opacity: 0.55;
                box-shadow:
                    0 0 5px rgba(56, 189, 248, 0.55),
                    0 0 10px rgba(56, 189, 248, 0.2);
            }

            50% {
                transform: scale(1.25);
                opacity: 1;
                box-shadow:
                    0 0 7px rgba(56, 189, 248, 0.95),
                    0 0 18px rgba(56, 189, 248, 0.4);
            }
        }

        /* =========================
            STABILER YOUTUBE PLAYER
        ========================= */

        .latest-video-container {
            margin-top: 20px;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-glass);
            background: rgba(10, 14, 23, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;

            opacity: 0;
            transform: translateY(8px);
            animation: scheduleReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
        }

        .latest-video-container:hover {
            border-color: var(--border-active);
            box-shadow: 0 15px 35px var(--accent-glow);
        }

        .latest-video-container iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        .agency-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .agency-card {
            display: flex;
            align-items: center;
            justify-content: space-between;

            background: var(--card-bg);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid var(--border-glass);
            padding: 20px 24px;
            border-radius: 16px;

            text-decoration: none;
            color: var(--text-main);

            font-weight: 600;
            font-size: 1rem;

            position: relative;
            overflow: hidden;
            cursor: pointer;

            opacity: 0;
            transform: translateX(30px);

            animation:
                slideInLinks
                0.8s
                cubic-bezier(0.16, 1, 0.3, 1)
                forwards;

            transition:
                all
                0.4s
                cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* =========================
            HOVER LIGHT SWEEP
        ========================= */

        .agency-card::after {
            content: '';
            position: absolute;

            top: 0;
            left: -120%;

            width: 45%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(56, 189, 248, 0.16),
                rgba(255, 255, 255, 0.08),
                transparent
            );

            transform: skewX(-18deg);
            pointer-events: none;
        }

        .agency-card:hover::after {
            animation: lightSweep 0.75s ease-out forwards;
        }

        @keyframes lightSweep {
            0% {
                left: -120%;
            }

            100% {
                left: 150%;
            }
        }

        .card-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-content svg {
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            transition: fill 0.3s ease;
        }

        .card-arrow {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
        }

        .agency-card:nth-child(1) { animation-delay: 0.2s; }
        .agency-card:nth-child(2) { animation-delay: 0.3s; }
        .agency-card:nth-child(3) { animation-delay: 0.4s; }
        .agency-card:nth-child(4) { animation-delay: 0.5s; }
        .agency-card:nth-child(5) { animation-delay: 0.6s; }
        .agency-card:nth-child(6) { animation-delay: 0.7s; }

        @keyframes slideInLinks {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .agency-card::before {
            content: '';

            position: absolute;
            top: 0;
            left: 0;

            width: 3px;
            height: 100%;

            background: var(--accent);
            opacity: 0;

            transition: opacity 0.3s ease;
        }

        .agency-card:hover {
            background: rgba(14, 20, 33, 0.9);
            border-color: var(--border-active);

            transform: translateX(6px) perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));

            box-shadow:
                0 20px 40px -15px
                var(--accent-glow);
        }

        .agency-card:hover::before {
            opacity: 1;
        }

        .agency-card:hover .card-content svg {
            fill: var(--accent);
        }

        .agency-card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
            color: var(--accent);
        }

        /* Live Badge Design */
        .live-badge {
            display: none;
            align-items: center;
            gap: 6px;

            font-size: 0.65rem;
            color: var(--live-green);
            background: rgba(34, 197, 94, 0.1);

            padding: 2px 8px;
            border-radius: 12px;

            border: 1px solid rgba(34, 197, 94, 0.3);

            margin-left: 10px;

            text-transform: uppercase;
        }

        .live-dot {
            width: 6px;
            height: 6px;

            background: var(--live-green);
            border-radius: 50%;

            box-shadow: 0 0 8px var(--live-green);

            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.3); }
            100% { transform: scale(0.9); }
        }

        /* =========================
            EMAIL MODAL (POPUP)
        ========================= */

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 4, 8, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: rgba(10, 14, 23, 0.95);
            border: 1px solid var(--border-active);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--accent-glow);
            transform: translateY(20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: var(--accent);
        }

        .email-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group textarea {
            background: rgba(2, 4, 8, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        /* =========================
            FOOTER
        ========================= */

        .agency-footer {
            width: 100%;
            max-width: 940px;

            margin: 40px auto 0 auto;

            display: flex;
            justify-content: center;
            align-items: center;

            border-top: 1px solid var(--border-glass);
            padding-top: 25px;

            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;

            color: var(--text-muted);

            text-transform: uppercase;
            letter-spacing: 2px;

            opacity: 0;

            animation:
                fadeInScale
                1s
                ease
                0.8s
                forwards;
        }

        .agency-footer-links {
            display: flex;
            align-items: center;
        }

        .agency-footer-links a {
            color: var(--text-muted);
            text-decoration: none;

            margin-left: 20px;

            transition: color 0.2s ease;
        }

        .agency-footer-links a:hover {
            color: var(--accent);
        }

        /* =========================
            MOBILE
        ========================= */

        @media (max-width: 768px) {

            body {
                padding: 40px 20px;
            }

            .agency-wrapper {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .agency-brand h1 {
                font-size: 3.2rem;
            }

            .upload-schedule {
                margin-top: 6px;
            }

            .latest-video-container {
                max-width: 100%;
            }

            .agency-footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .agency-footer-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
            }

            .agency-footer-links a {
                margin: 0;
            }
        }
    </style>
</head>

    <!-- Skripte -->
    <script>
        /* =========================
            MOUSE GLOW
        ========================= */

        if (window.matchMedia('(pointer: fine)').matches) {
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let currentX = mouseX;
            let currentY = mouseY;

            window.addEventListener('mousemove', (event) => {
                mouseX = event.clientX;
                mouseY = event.clientY;
            }, { passive: true });

            function updateMouseGlow() {
                currentX += (mouseX - currentX) * 0.08;
                currentY += (mouseY - currentY) * 0.08;

                document.body.style.setProperty('--mouse-x', `${currentX}px`);
                document.body.style.setProperty('--mouse-y', `${currentY}px`);

                requestAnimationFrame(updateMouseGlow);
            }

            updateMouseGlow();
        }

        /* =========================
            3D TILT & UI SOUNDS
        ========================= */

        const cards = document.querySelectorAll('.agency-card');
        let audioCtx;

        function playHoverSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);

            gainNode.gain.setValueAtTime(0.015, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -6;
                const rotateY = ((x - centerX) / centerX) * 6;
                
                card.style.setProperty('--rx', `${rotateX}deg`);
                card.style.setProperty('--ry', `${rotateY}deg`);
            });

            card.addEventListener('mouseleave', () => {
                card.style.setProperty('--rx', `0deg`);
                card.style.setProperty('--ry', `0deg`);
            });

            card.addEventListener('mouseenter', playHoverSound);
        });

        /* =========================
            EMAIL MODAL LOGIC
        ========================= */

        const emailCard = document.getElementById('open-email-modal');
        const emailModal = document.getElementById('emailModal');
        const closeEmailModal = document.getElementById('close-email-modal');

        emailCard.addEventListener('click', () => {
            emailModal.classList.add('active');
        });

        closeEmailModal.addEventListener('click', () => {
            emailModal.classList.remove('active');
        });

        emailModal.addEventListener('click', (e) => {
            if (e.target === emailModal) {
                emailModal.classList.remove('active');
            }
        });

        /* =========================
            LIVE STATUS API
        ========================= */

        fetch('https://decapi.me/twitch/uptime/mikzo86')
            .then(response => response.text())
            .then(data => {
                if (
                    data &&
                    !data.includes('offline') &&
                    !data.includes('error')
                ) {
                    document.getElementById('twitch-badge').style.display = 'inline-flex';
                }
            })
            .catch(() => {});

        fetch('https://decapi.me/youtube/live_check?user=mikzo86')
            .then(response => response.text())
            .then(data => {
                if (
                    data === '1' ||
                    data.toLowerCase().includes('yes')
                ) {
                    document.getElementById('youtube-badge').style.display = 'inline-flex';
                }
            })
            .catch(() => {});
    </script>
