    <title>MIKZO — Offizielle Kanäle</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #020408;
            --card-bg: rgba(10, 14, 23, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-active: rgba(56, 189, 248, 0.5);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --live-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(56, 189, 248, 0.08) 0%,
                    transparent 40%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(14, 165, 233, 0.05) 0%,
                    transparent 40%
                );

            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 60px 40px;
            overflow-x: hidden;
        }

        .agency-wrapper {
            width: min(900px, 100%);
            margin: 0 auto;

            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 50px;
            align-items: center;

            animation: fadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .agency-brand {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .agency-brand h1 {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 0.95;

            background: linear-gradient(
                120deg,
                #ffffff 30%,
                var(--accent) 50%,
                #ffffff 70%
            );

            background-size: 200% auto;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: shimmer 6s linear infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .agency-brand p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .agency-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .agency-card {
            display: flex;
            align-items: center;
            justify-content: space-between;

            background: var(--card-bg);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid var(--border-glass);
            padding: 20px 24px;
            border-radius: 16px;

            text-decoration: none;
            color: var(--text-main);

            font-weight: 600;
            font-size: 1rem;

            position: relative;
            overflow: hidden;

            opacity: 0;
            transform: translateX(30px);

            animation:
                slideInLinks
                0.8s
                cubic-bezier(0.16, 1, 0.3, 1)
                forwards;

            transition:
                all
                0.4s
                cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-content svg {
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            transition: fill 0.3s ease;
        }

        .card-arrow {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
        }

        .agency-card:nth-child(1) { animation-delay: 0.2s; }
        .agency-card:nth-child(2) { animation-delay: 0.3s; }
        .agency-card:nth-child(3) { animation-delay: 0.4s; }
        .agency-card:nth-child(4) { animation-delay: 0.5s; }
        .agency-card:nth-child(5) { animation-delay: 0.6s; }
        .agency-card:nth-child(6) { animation-delay: 0.7s; }

        @keyframes slideInLinks {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .agency-card::before {
            content: '';

            position: absolute;
            top: 0;
            left: 0;

            width: 3px;
            height: 100%;

            background: var(--accent);
            opacity: 0;

            transition: opacity 0.3s ease;
        }

        .agency-card:hover {
            background: rgba(14, 20, 33, 0.9);
            border-color: var(--border-active);

            transform: translateX(6px);

            box-shadow:
                0 20px 40px -15px
                var(--accent-glow);
        }

        .agency-card:hover::before {
            opacity: 1;
        }

        .agency-card:hover .card-content svg {
            fill: var(--accent);
        }

        .agency-card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
            color: var(--accent);
        }

        /* Live Badge Design (standardmäßig ausgeblendet) */
        .live-badge {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            color: var(--live-green);
            background: rgba(34, 197, 94, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(34, 197, 94, 0.3);
            margin-left: 10px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--live-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--live-green);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.3); }
            100% { transform: scale(0.9); }
        }

        /* =========================
            FOOTER
        ========================= */

        .agency-footer {
            width: 100%;
            max-width: 900px;

            margin: 40px auto 0 auto;

            display: flex;
            justify-content: center;
            align-items: center;

            border-top: 1px solid var(--border-glass);
            padding-top: 25px;

            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;

            color: var(--text-muted);

            text-transform: uppercase;
            letter-spacing: 2px;

            opacity: 0;

            animation:
                fadeInScale
                1s
                ease
                0.8s
                forwards;
        }

        .agency-footer-links {
            display: flex;
            align-items: center;
        }

        .agency-footer-links a {
            color: var(--text-muted);
            text-decoration: none;

            margin-left: 20px;

            transition: color 0.2s ease;
        }

        .agency-footer-links a:hover {
            color: var(--accent);
        }

        /* =========================
            MOBILE
        ========================= */

        @media (max-width: 768px) {

            body {
                padding: 40px 20px;
            }

            .agency-wrapper {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .agency-brand h1 {
                font-size: 3.2rem;
            }

            .agency-footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .agency-footer-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
            }

            .agency-footer-links a {
                margin: 0;
            }
        }
    </style>
</head>
